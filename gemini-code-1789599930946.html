<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #3d1a04 0%, #1a0c02 70%, #080300 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }
  </style>

  <!-- Biblioteca Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Controles para mover la cámara (OrbitControls) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Controles de cámara interactivos
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; 
    controls.dampingFactor = 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 50;

    const mainGroup = new THREE.Group();
    mainGroup.rotation.x = 0.85;
    mainGroup.rotation.z = -0.3;
    scene.add(mainGroup);

    // Textura suave para las partículas del corazón
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.3, 'rgba(255, 230, 150, 0.8)');
      gradient.addColorStop(0.7, 'rgba(255, 180, 50, 0.2)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }
    const glowTexture = createGlowTexture();

    // 1. Agujero Negro Central
    const blackHoleGeo = new THREE.SphereGeometry(0.55, 32, 32);
    const blackHoleMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const blackHole = new THREE.Mesh(blackHoleGeo, blackHoleMat);
    mainGroup.add(blackHole);

    // 2. Aros Naranja / Dorado
    function createPointRing(radiusMin, radiusMax, particleCount, pointSize) {
      const ringGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = radiusMin + Math.random() * (radiusMax - radiusMin);

        const x = Math.cos(angle) * r;
        const z = Math.sin(angle) * r;
        const y = (Math.random() - 0.5) * 0.12;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const color = new THREE.Color();
        color.setHSL(0.08 + Math.random() * 0.05, 1.0, 0.55 + Math.random() * 0.2);

        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }

      ringGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      ringGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      return new THREE.Points(ringGeo, new THREE.PointsMaterial({
        size: pointSize,
        vertexColors: true,
        transparent: true,
        opacity: 0.9
      }));
    }

    mainGroup.add(createPointRing(0.65, 0.95, 2500, 0.04));
    mainGroup.add(createPointRing(1.1, 1.45, 3000, 0.038));

    // 3. Galaxia Espiral
    const countGalaxy = 22000;
    const galaxyGeometry = new THREE.BufferGeometry();
    const galaxyPositions = new Float32Array(countGalaxy * 3);
    const galaxyColors = new Float32Array(countGalaxy * 3);

    const arms = 2; 
    const armTightness = 0.8; 
    const rScatter = 1.2; 
    const thetaScatter = 0.6; 

    for (let i = 0; i < countGalaxy; i++) {
      const r = Math.random() * 11.0 + 1.25; 
      const armIndex = i % arms;
      
      const armTheta = (armIndex * (Math.PI * 2 / arms));
      const baseTheta = armTightness * r;
      const scatterTheta = (Math.random() - 0.5) * thetaScatter;
      const theta = armTheta + baseTheta + scatterTheta;

      const x = (Math.cos(theta) * r) + (Math.random() - 0.5) * rScatter * (r / 5.0);
      const z = (Math.sin(theta) * r) + (Math.random() - 0.5) * rScatter * (r / 5.0);
      const y = (Math.random() - 0.5) * (0.35 + r * 0.1); 

      galaxyPositions[i * 3] = x;
      galaxyPositions[i * 3 + 1] = y;
      galaxyPositions[i * 3 + 2] = z;

      let color = new THREE.Color();
      const randColor = Math.random();

      if (randColor < 0.5) {
        color.setHSL(0.14 + Math.random() * 0.04, 1.0, 0.6); 
      } else if (randColor < 0.85) {
        color.setHSL(0.08 + Math.random() * 0.05, 1.0, 0.55); 
      } else {
        color.setHSL(0.16, 1.0, 0.85); 
      }

      galaxyColors[i * 3] = color.r;
      galaxyColors[i * 3 + 1] = color.g;
      galaxyColors[i * 3 + 2] = color.b;
    }

    galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(galaxyPositions, 3));
    galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

    const galaxyDisk = new THREE.Points(galaxyGeometry, new THREE.PointsMaterial({
      size: 0.045, 
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending, 
      depthWrite: false,
      opacity: 0.95
    }));
    mainGroup.add(galaxyDisk);

    // 4. Corazón Delgado
    const countHeart = 3200;
    const heartGeometry = new THREE.BufferGeometry();
    const heartPositions = new Float32Array(countHeart * 3);
    const heartColors = new Float32Array(countHeart * 3);

    const scale = 0.07;
    const yOffset = 0.55 + (17 * scale); 

    for (let i = 0; i < countHeart; i++) {
      const t = Math.random() * Math.PI * 2;
      const zOffset = (Math.random() - 0.5) * 0.25;
      
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

      x += (Math.random() - 0.5) * 0.3;
      y += (Math.random() - 0.5) * 0.3;

      heartPositions[i * 3] = x * scale;
      heartPositions[i * 3 + 1] = (y * scale) + yOffset; 
      heartPositions[i * 3 + 2] = zOffset;

      const color = new THREE.Color();
      color.setHSL(0.12 + Math.random() * 0.04, 1.0, 0.65 + Math.random() * 0.2);

      heartColors[i * 3] = color.r; 
      heartColors[i * 3 + 1] = color.g; 
      heartColors[i * 3 + 2] = color.b;
    }

    heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
    heartGeometry.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

    const heartParticles = new THREE.Points(heartGeometry, new THREE.PointsMaterial({
      size: 0.11,
      map: glowTexture,
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 0.88
    }));
    mainGroup.add(heartParticles);

    // MENSAJE CENTRADO: "Te amo Kiara ❤️"
    function createCenteredTextMessage(message) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1024;
      canvas.height = 256;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = 'Bold 72px "Segoe UI", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffaa00';
      ctx.shadowBlur = 30;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(message, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ 
        map: texture, 
        transparent: true,
        blending: THREE.NormalBlending
      });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(2.2, 0.55, 1);
      return sprite;
    }

    const centerTextMesh = createCenteredTextMessage("Te amo Kiara ❤️");
    centerTextMesh.position.set(0, yOffset + 0.2, 0.15); 
    mainGroup.add(centerTextMesh);

    // Generador de Ramos de Flores 3D
    function create3DFlowerBouquet() {
      const bouquetGroup = new THREE.Group();

      const stemMat = new THREE.MeshBasicMaterial({ color: 0x2e7d32 });
      const leafMat = new THREE.MeshBasicMaterial({ color: 0x388e3c, side: THREE.DoubleSide });
      const petalMat = new THREE.MeshBasicMaterial({ color: 0xffd500, side: THREE.DoubleSide });
      const centerMat = new THREE.MeshBasicMaterial({ color: 0x5d4037 });

      const flowerCount = 7; 

      for (let i = 0; i < flowerCount; i++) {
        const flowerGroup = new THREE.Group();

        const angle = (i / flowerCount) * Math.PI * 2;
        const tilt = 0.15 + Math.random() * 0.2;

        const stemGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.8, 8);
        const stem = new THREE.Mesh(stemGeo, stemMat);
        stem.position.y = 0.4;
        flowerGroup.add(stem);

        const leafGeo = new THREE.PlaneGeometry(0.08, 0.2);
        const leaf1 = new THREE.Mesh(leafGeo, leafMat);
        leaf1.position.set(0.03, 0.3, 0);
        leaf1.rotation.z = -0.5;
        flowerGroup.add(leaf1);

        const flowerHead = new THREE.Group();
        flowerHead.position.y = 0.8;

        const centerGeo = new THREE.SphereGeometry(0.06, 12, 12);
        const centerMesh = new THREE.Mesh(centerGeo, centerMat);
        flowerHead.add(centerMesh);

        const petalCount = 10;
        const petalGeo = new THREE.ConeGeometry(0.04, 0.18, 4);
        petalGeo.rotateX(Math.PI / 2);

        for (let p = 0; p < petalCount; p++) {
          const petalAngle = (p / petalCount) * Math.PI * 2;
          const petal = new THREE.Mesh(petalGeo, petalMat);
          petal.position.set(Math.cos(petalAngle) * 0.08, Math.sin(petalAngle) * 0.08, 0);
          petal.rotation.z = petalAngle + Math.PI / 2;
          flowerHead.add(petal);
        }

        flowerGroup.add(flowerHead);

        flowerGroup.rotation.x = Math.sin(angle) * tilt;
        flowerGroup.rotation.z = Math.cos(angle) * tilt;

        bouquetGroup.add(flowerGroup);
      }

      const ribbonGeo = new THREE.TorusGeometry(0.06, 0.02, 8, 16);
      const ribbonMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
      const ribbon = new THREE.Mesh(ribbonGeo, ribbonMat);
      ribbon.rotation.x = Math.PI / 2;
      ribbon.position.y = 0.25;
      bouquetGroup.add(ribbon);

      bouquetGroup.scale.set(0.65, 0.65, 0.65);
      return bouquetGroup;
    }

    // Agregar 60 Ramos de Flores 3D
    const totalBouquets = 60;
    for (let b = 0; b < totalBouquets; b++) {
      const bouquet = create3DFlowerBouquet();
      const angle = (b / totalBouquets) * Math.PI * 2;
      const radius = 2.5 + Math.random() * 8.5;
      
      bouquet.position.set(
        Math.cos(angle) * radius,
        (Math.random() - 0.5) * 3.8,
        Math.sin(angle) * radius
      );

      bouquet.rotation.x = Math.random() * Math.PI;
      bouquet.rotation.y = Math.random() * Math.PI;
      bouquet.rotation.z = Math.random() * Math.PI;

      mainGroup.add(bouquet);
    }

    // NUEVA SECCIÓN: Generador de 100 Tulipanes Amarillos en 3D
    function create3DYellowTulip() {
      const tulipGroup = new THREE.Group();

      const stemMat = new THREE.MeshBasicMaterial({ color: 0x388e3c });
      const petalMat = new THREE.MeshBasicMaterial({ color: 0xffea00, side: THREE.DoubleSide });
      const leafMat = new THREE.MeshBasicMaterial({ color: 0x2e7d32, side: THREE.DoubleSide });

      // Tallo
      const stemGeo = new THREE.CylinderGeometry(0.01, 0.01, 0.6, 8);
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = 0.3;
      tulipGroup.add(stem);

      // Hoja estilizada
      const leafGeo = new THREE.PlaneGeometry(0.06, 0.25);
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      leaf.position.set(0.02, 0.2, 0);
      leaf.rotation.z = -0.3;
      tulipGroup.add(leaf);

      // Capullo / Pétalos del Tulipán
      const tulipHead = new THREE.Group();
      tulipHead.position.y = 0.6;

      const petalCount = 6;
      for (let p = 0; p < petalCount; p++) {
        const petalAngle = (p / petalCount) * Math.PI * 2;
        const petalGeo = new THREE.SphereGeometry(0.06, 8, 8, 0, Math.PI, 0, Math.PI / 1.5);
        const petal = new THREE.Mesh(petalGeo, petalMat);
        petal.rotation.y = petalAngle;
        petal.rotation.x = -0.2;
        tulipHead.add(petal);
      }

      tulipGroup.add(tulipHead);
      tulipGroup.scale.set(0.85, 0.85, 0.85);
      return tulipGroup;
    }

    // Esparcir 100 Tulipanes Amarillos 3D por la galaxia
    const totalTulips = 100;
    for (let t = 0; t < totalTulips; t++) {
      const tulip = create3DYellowTulip();
      const angle = (t / totalTulips) * Math.PI * 2;
      const radius = 2.0 + Math.random() * 9.0;

      tulip.position.set(
        Math.cos(angle) * radius,
        (Math.random() - 0.5) * 4.0,
        Math.sin(angle) * radius
      );

      tulip.rotation.x = Math.random() * Math.PI;
      tulip.rotation.y = Math.random() * Math.PI;
      tulip.rotation.z = Math.random() * Math.PI;

      mainGroup.add(tulip);
    }

    // 5. Generador de Sprites para Frases
    function createTransparentTextSprite(message) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = 'Bold 32px "Segoe UI", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffaa00';
      ctx.shadowBlur = 18;
      ctx.textAlign = 'center';
      ctx.fillText(message, 256, 70);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(2.4, 0.6, 1);
      return sprite;
    }

    // 6. Generador de Flores Sprites
    function createCustomFlowerSprite(type) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 128;
      canvas.height = 128;
      ctx.clearRect(0, 0, 128, 128);

      const cx = 64, cy = 64;

      if (type === 'girasol') {
        ctx.fillStyle = '#ffcc00';
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * 22, cy + Math.sin(a) * 22, 10, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#5d4037';
        ctx.beginPath();
        ctx.arc(cx, cy, 15, 0, Math.PI * 2);
        ctx.fill();

      } else if (type === 'rosa_amarilla') {
        ctx.fillStyle = '#ffe033';
        for (let r = 28; r > 8; r -= 6) {
          for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2 + r;
            ctx.beginPath();
            ctx.arc(cx + Math.cos(a) * (r * 0.5), cy + Math.sin(a) * (r * 0.5), r * 0.4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.fillStyle = '#ffb300';
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fill();

      } else if (type === 'tulipan') {
        ctx.fillStyle = '#ffd500';
        ctx.beginPath();
        ctx.arc(cx - 10, cy, 18, 0, Math.PI * 2);
        ctx.arc(cx + 10, cy, 18, 0, Math.PI * 2);
        ctx.arc(cx, cy - 8, 18, 0, Math.PI * 2);
        ctx.fill();

      } else {
        ctx.fillStyle = '#fff066';
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          ctx.beginPath();
          ctx.ellipse(cx + Math.cos(a) * 20, cy + Math.sin(a) * 20, 12, 6, a, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#ff9900';
        ctx.beginPath();
        ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.fill();
      }

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(0.7, 0.7, 1);
      return sprite;
    }
